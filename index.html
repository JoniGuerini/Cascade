<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cascade — Infinite generator game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/break_eternity.js@2"></script>
<style>
:root {
  --bg-page: #f6f6f2;
  --bg-card: #ffffff;
  --bg-soft: #f1f1ec;
  --bg-pill: #ebebe5;
  --bg-table: #f1f1ec;
  --btn-bg: #ffffff;
  --bg-accent: #fff1ec;
  --text-1: #0a0a0a;
  --text-2: #525252;
  --text-3: #a3a3a3;
  --hairline: rgba(0,0,0,.06);
  --hairline-2: rgba(0,0,0,.04);
  --accent: #e85d39;
  --accent-soft: rgba(232,93,57,.10);
  --pos: #16794a;
  --pos-bg: #e8f4ec;
  --neg: #b91c1c;
  --neg-bg: #fdebec;
  --shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    0 1px 2px rgba(0,0,0,.06),
    0 2px 6px rgba(0,0,0,.05),
    0 0 0 .5px rgba(0,0,0,.14);
  --shadow-lg:
    inset 0 1px 0 rgba(255,255,255,.95),
    0 2px 5px rgba(0,0,0,.08),
    0 8px 22px rgba(0,0,0,.10),
    0 0 0 .5px rgba(0,0,0,.16);
  --shadow-pill:
    inset 0 1px 0 rgba(255,255,255,.7),
    0 1px 2px rgba(0,0,0,.06),
    0 0 0 .5px rgba(0,0,0,.12);
  --shadow-press:
    inset 0 1px 2px rgba(0,0,0,.1),
    0 0 0 .5px rgba(0,0,0,.14);
  --shadow-modal: 0 30px 80px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.1), inset 0 1px 0 #fff, 0 0 0 .5px rgba(0,0,0,.06);
  --ring: rgba(232,93,57,.2);
}
html.dark {
  --bg-page: #08080a;
  --bg-card: #141416;
  --bg-soft: #1c1c20;
  --bg-pill: #232328;
  --bg-table: #0e0e10;
  --btn-bg: #20202a;
  --bg-accent: #2a1612;
  --text-1: #fafafa;
  --text-2: #a1a1aa;
  --text-3: #525258;
  --hairline: rgba(255,255,255,.06);
  --hairline-2: rgba(255,255,255,.04);
  --accent: #ff8060;
  --accent-soft: rgba(255,128,96,.14);
  --pos: #5fd693;
  --pos-bg: rgba(95,214,147,.12);
  --neg: #f87171;
  --neg-bg: rgba(248,113,113,.12);
  --shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.6), 0 0 0 .5px rgba(0,0,0,.7);
  --shadow-lg: inset 0 1px 0 rgba(255,255,255,.07), 0 6px 18px rgba(0,0,0,.5), 0 0 0 .5px rgba(0,0,0,.7);
  --shadow-pill: inset 0 1px 0 rgba(255,255,255,.05), 0 1px 1px rgba(0,0,0,.4), 0 0 0 .5px rgba(0,0,0,.7);
  --shadow-press: inset 0 2px 4px rgba(0,0,0,.5), 0 0 0 .5px rgba(0,0,0,.7);
  --shadow-modal: 0 30px 80px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 .5px rgba(0,0,0,.7);
  --ring: rgba(255,128,96,.28);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
  font-feature-settings: "ss01", "ss03", "cv11";
  background: var(--bg-page);
  color: var(--text-1);
  transition: background .35s ease, color .35s ease;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

button { font-family: inherit; }

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: 10px;
  gap: 10px;
}

.card {
  background: var(--bg-card);
  border-radius: 14px;
  box-shadow: var(--shadow);
  transition: box-shadow .25s, background .35s;
}

.icon-btn {
  width: 36px; height: 36px;
  border-radius: 9px;
  background: var(--btn-bg);
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-2);
  border: none;
  transition: color .15s, box-shadow .25s, transform .15s;
}
.icon-btn:hover { color: var(--text-1); box-shadow: var(--shadow-lg); }
.icon-btn:active { transform: scale(.96); box-shadow: var(--shadow-press); }
.icon-btn .ti { font-size: 17px; }
.icon-btn.small { width: 30px; height: 30px; border-radius: 8px; }
.icon-btn.small .ti { font-size: 15px; }
.gen-title-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn.active {
  background: var(--accent);
  color: white;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(0,0,0,.18),
    0 2px 5px rgba(0,0,0,.2),
    0 0 0 .5px rgba(0,0,0,.12);
}
.icon-btn.active:hover { color: white; }
html.freemode .cost-prev {
  text-decoration: line-through;
  opacity: 0.5;
}

.controls-card {
  flex: none;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.resources-card {
  flex: none;
  padding: 14px 18px 18px;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.025em;
  min-width: 0;
}
.logo-mark {
  width: 26px; height: 26px;
  border-radius: 8px;
  background: var(--text-1);
  color: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600;
  font-size: 12px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.4),
    inset 0 -1px 0 rgba(0,0,0,.6),
    0 1px 2px rgba(0,0,0,.18),
    0 4px 10px rgba(0,0,0,.18),
    0 0 0 .5px rgba(0,0,0,.6);
  transition: background .35s, color .35s, box-shadow .35s;
  flex-shrink: 0;
}
html.dark .logo-mark {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.65),
    inset 0 -1px 0 rgba(0,0,0,.2),
    0 1px 2px rgba(0,0,0,.5),
    0 4px 12px rgba(0,0,0,.45),
    0 0 0 .5px rgba(0,0,0,.35);
}
.hero-controls {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.play-time {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-2);
  font-family: 'Geist Mono', monospace;
  font-feature-settings: 'tnum';
  white-space: nowrap;
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--bg-pill);
  box-shadow: var(--shadow-pill);
}
.play-time .ti { font-size: 13px; }


.hero-btn {
  background: transparent; border: none;
  color: var(--text-2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  padding: 8px 11px;
  border-radius: 8px;
  display: inline-flex; align-items: center; gap: 5px;
  transition: color .15s, background .2s, box-shadow .2s, transform .1s;
  white-space: nowrap;
}
.hero-btn:hover {
  color: var(--neg);
  background: var(--neg-bg);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(0,0,0,.06),
    0 2px 5px rgba(0,0,0,.08),
    0 0 0 .5px rgba(0,0,0,.06);
}
html.dark .hero-btn:hover {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 -1px 0 rgba(0,0,0,.3),
    0 2px 6px rgba(0,0,0,.4),
    0 0 0 .5px rgba(0,0,0,.4);
}
.hero-btn:active { transform: scale(0.97); }
.hero-btn .ti { font-size: 13px; }

.resources-card h1 {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin: 0 0 6px;
}
.resources-card .big {
  font-size: 32px;
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1;
  margin: 0;
  font-family: 'Geist Mono', monospace;
  font-feature-settings: 'tnum';
}
.resources-card .rate {
  margin-top: 8px;
  font-size: 13px;
  color: var(--text-2);
  font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.resources-card .rate .num {
  color: var(--pos);
  font-family: 'Geist Mono', monospace;
  font-feature-settings: 'tnum';
}
.resource + .resource { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--hairline); }

.gen-title-card {
  flex: none;
  padding: 14px 20px;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px;
}
.gen-title-card h2 { font-size: 14px; font-weight: 500; margin: 0; }
.gen-title-card p { font-size: 12px; color: var(--text-2); margin: 3px 0 0; }
.gen-title-info { display: flex; align-items: center; gap: 14px; }
.col-headers {
  flex: none;
  display: grid;
  grid-template-columns: var(--tier-badge-min, 38px) 1fr 1fr 1fr 92px 92px;
  gap: 12px;
  padding: 12px 20px;
  font-size: 10.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
}
.col-headers > div:nth-child(2),
.col-headers > div:nth-child(3) { text-align: center; }
.cost-header { text-align: center; }

.gen-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
  overscroll-behavior: contain;
  padding: 1px;
  margin: -1px;
}
.gen-list::-webkit-scrollbar { display: none; width: 0; height: 0; }

#gen-rows {
  position: relative;
}

.gen-row {
  display: grid;
  grid-template-columns: var(--tier-badge-min, 38px) 1fr 1fr 1fr 92px 92px;
  gap: 12px;
  padding: 14px 20px;
  align-items: center;
  background: var(--bg-card);
  border-radius: 14px;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, background .35s, transform .15s;
  position: absolute;
  left: 0;
  right: 0;
}
.gen-row:hover { box-shadow: var(--shadow-lg); }
.gen-row > div:first-child { display: flex; align-items: center; justify-content: center; }

.gen-row.is-next .tier-badge {
  background: var(--bg-soft);
  color: var(--text-3);
  box-shadow: inset 0 0 0 1px var(--hairline);
}
.gen-row.is-next .gen-name { color: var(--text-2); }

.gen-row.new-tier { animation: slideUp .45s cubic-bezier(.2, .8, .2, 1); }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.tier-badge {
  min-width: 38px;
  height: 38px;
  padding: 0 10px;
  border-radius: 10px;
  box-shadow: var(--shadow-pill);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'Geist Mono', monospace;
  font-weight: 600;
  font-size: 12px;
  color: var(--text-1);
  background: var(--btn-bg);
  transition: transform .25s, background .2s, color .2s;
  letter-spacing: 0;
  box-sizing: border-box;
}
.gen-row.has-owned .tier-badge { color: var(--text-1); }
.tier-badge.pulse { animation: badgePulse .5s ease; }
@keyframes badgePulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.18); }
  100% { transform: scale(1); }
}

.gen-meta { min-width: 0; }
.gen-name { font-weight: 500; font-size: 14px; line-height: 1.2; }
.gen-produces {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 3px;
  display: flex; align-items: center; gap: 4px;
}
.gen-produces .ti { font-size: 11px; }

.gen-num {
  font-family: 'Geist Mono', monospace;
  font-weight: 500;
  font-feature-settings: 'tnum';
  font-size: 13px;
  text-align: center;
}
.gen-num.muted { color: var(--text-3); }
.gen-num.dim { color: var(--text-2); }

.cost-group {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
  font-family: 'Geist Mono', monospace;
  font-feature-settings: 'tnum';
}
.cost-energy, .cost-prev {
  font-weight: 500;
  font-size: 13px;
}
.cost-energy { color: var(--text-1); }
.cost-energy.muted { color: var(--text-3); }
.cost-energy.lacking { color: var(--neg); }
.cost-prev { color: var(--text-2); white-space: nowrap; }
.cost-prev.muted { color: var(--text-3); }
.cost-prev.lacking { color: var(--neg); }

.buy-btn {
  padding: 8px 0;
  font-size: 12px;
  background: var(--btn-bg);
  box-shadow: var(--shadow);
  border: none;
  border-radius: 8px;
  color: var(--text-1);
  cursor: pointer;
  font-weight: 500;
  transition: box-shadow .15s, transform .1s;
  font-family: inherit;
  width: 100%;
  letter-spacing: 0.01em;
  -webkit-appearance: none;
  appearance: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.buy-btn:hover:not(:disabled) { box-shadow: var(--shadow-lg); }
.buy-btn:active:not(:disabled) { transform: scale(0.96); box-shadow: var(--shadow-press); }
.buy-btn:disabled {
  color: var(--text-3);
  cursor: not-allowed;
  box-shadow: var(--shadow-pill);
  opacity: 0.7;
}

.buy-btn.afford {
  background: var(--accent);
  color: white;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(0,0,0,.18),
    0 2px 5px rgba(0,0,0,.2),
    0 0 0 .5px rgba(0,0,0,.12);
}
html.dark .buy-btn.afford {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.32),
    inset 0 -1px 0 rgba(0,0,0,.4),
    0 2px 6px rgba(0,0,0,.5),
    0 0 0 .5px rgba(0,0,0,.4);
}
.buy-btn.afford:hover {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(0,0,0,.2),
    0 4px 14px rgba(232,93,57,.4),
    0 0 0 .5px rgba(0,0,0,.12);
}
html.dark .buy-btn.afford:hover {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(0,0,0,.42),
    0 4px 16px rgba(255,128,96,.32),
    0 0 0 .5px rgba(0,0,0,.4);
}
.buy-btn.afford:active {
  transform: scale(0.96);
  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.28),
    0 0 0 .5px rgba(0,0,0,.18);
}

.fade-in { animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) backwards; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  animation: fadeIn .2s ease;
  padding: 20px;
}
.modal-backdrop[hidden] { display: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-card {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 24px;
  max-width: 400px;
  width: 100%;
  box-shadow: var(--shadow-modal);
  animation: modalIn .28s cubic-bezier(.2, .8, .2, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--neg-bg);
  color: var(--neg);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
  box-shadow: var(--shadow-pill);
}
.modal-icon .ti { font-size: 22px; }

.modal-card h3 {
  font-size: 17px; font-weight: 500;
  margin: 0 0 6px;
  letter-spacing: -0.02em;
}
.modal-intro {
  font-size: 13.5px;
  color: var(--text-2);
  margin: 0 0 12px;
  line-height: 1.5;
}

.modal-stats {
  list-style: none;
  padding: 14px 16px;
  margin: 0 0 14px;
  background: var(--bg-soft);
  border-radius: 10px;
  box-shadow: var(--shadow-pill);
}
.modal-stats li {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 13px;
  padding: 4px 0;
}
.modal-stats li .v {
  font-family: 'Geist Mono', monospace;
  font-feature-settings: 'tnum';
  font-weight: 500;
  color: var(--text-1);
  min-width: 80px;
}
.modal-stats li .lbl { color: var(--text-2); font-size: 12.5px; }

.modal-warning {
  font-size: 12px;
  color: var(--text-3);
  margin: 0 0 20px;
  display: flex; align-items: center; gap: 5px;
}
.modal-warning .ti { font-size: 13px; }

.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-modal {
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  font-family: inherit;
  transition: box-shadow .15s, transform .1s;
}
.btn-modal.cancel {
  background: var(--btn-bg);
  color: var(--text-1);
  box-shadow: var(--shadow);
}
.btn-modal.cancel:hover { box-shadow: var(--shadow-lg); }
.btn-modal.cancel:active { transform: scale(.97); box-shadow: var(--shadow-press); }
.btn-modal.danger {
  background: var(--neg);
  color: white;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(0,0,0,.2),
    0 2px 5px rgba(0,0,0,.2),
    0 0 0 .5px rgba(0,0,0,.12);
}
html.dark .btn-modal.danger {
  background: #b91c1c;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.2),
    inset 0 -1px 0 rgba(0,0,0,.4),
    0 2px 6px rgba(0,0,0,.5),
    0 0 0 .5px rgba(0,0,0,.4);
}
.btn-modal.danger:hover {
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.32),
    inset 0 -1px 0 rgba(0,0,0,.22),
    0 4px 14px rgba(185,28,28,.4),
    0 0 0 .5px rgba(0,0,0,.12);
}
.btn-modal.danger:active {
  transform: scale(.97);
  box-shadow: inset 0 2px 4px rgba(0,0,0,.3), 0 0 0 .5px rgba(0,0,0,.18);
}

@media (max-width: 720px) {
  .controls-card { padding: 10px 14px; }
  .resources-card { padding: 14px 16px; }
  .resources-card .big { font-size: 28px; }
  .play-time span:not(.ti) { display: none; }
  .play-time .ti { font-size: 14px; }
  .hero-btn span { display: none; }
  .hero-btn { padding: 8px; }
  .hero-btn .ti { font-size: 14px; }
  .col-headers, .gen-row {
    grid-template-columns: 36px 1fr 60px 70px 76px;
    padding: 12px 14px;
    gap: 8px;
  }
  .col-headers > div:nth-child(3),
  .col-headers > div:nth-child(7),
  .gen-row > div:nth-child(3),
  .gen-row > div:nth-child(7) { display: none; }
  .tier-badge { width: 32px; height: 32px; font-size: 11px; }
  .gen-num { font-size: 12px; }
  .buy-btn { font-size: 11px; padding: 7px 4px; }
  .gen-title-card { padding: 12px 14px; }
  .col-headers { padding: 10px 14px; }
  .modal-card { padding: 20px; }
}
</style>
</head>
<body>

<div class="app">

  <div class="card controls-card fade-in">
    <div class="logo">
      <div class="logo-mark">C</div>
      <span>Cascade</span>
    </div>
    <div class="hero-controls">
      <span class="play-time">
        <i class="ti ti-activity"></i>
        <span id="fps-text">— fps</span>
      </span>
      <span class="play-time">
        <i class="ti ti-clock"></i>
        <span id="elapsed-text">0s</span>
      </span>
      <span class="play-time" id="save-ind">
        <i class="ti ti-cloud-check"></i>
        <span id="save-text">saved</span>
      </span>
      <button class="hero-btn" id="reset" aria-label="Reset progress">
        <i class="ti ti-refresh"></i>
        <span>Reset</span>
      </button>
      <button class="icon-btn" id="autobuy-toggle" aria-label="Toggle auto-buy">
        <i class="ti ti-player-play"></i>
      </button>
      <button class="icon-btn" id="freemode-toggle" aria-label="Toggle free mode">
        <i class="ti ti-bolt"></i>
      </button>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
        <i class="ti ti-sun" id="theme-icon"></i>
      </button>
    </div>
  </div>

  <div class="card resources-card fade-in" style="animation-delay:.04s">
    <div class="resource">
      <h1>Energy</h1>
      <p class="big" id="energy">10</p>
      <p class="rate"><span class="num" id="rate">+0</span> per second</p>
    </div>
  </div>

  <div class="card gen-title-card fade-in" style="animation-delay:.08s">
    <div class="gen-title-info">
      <div class="tier-badge" id="max-tier-text">—</div>
      <div>
        <h2>Generators</h2>
        <p>Each tier produces the previous one — buy one to unlock the next</p>
      </div>
    </div>
    <div class="gen-title-actions">
      <button class="icon-btn small" id="scroll-top" aria-label="Scroll to top">
        <i class="ti ti-arrow-bar-to-up"></i>
      </button>
      <button class="icon-btn small" id="scroll-bottom" aria-label="Scroll to bottom">
        <i class="ti ti-arrow-bar-to-down"></i>
      </button>
    </div>
  </div>

  <div class="card col-headers fade-in" style="animation-delay:.12s">
    <div>Tier</div>
    <div>Owned</div>
    <div>Rate</div>
    <div class="cost-header">Cost</div>
    <div></div>
    <div></div>
  </div>

  <div class="gen-list fade-in" id="gen-scroll" style="animation-delay:.16s">
    <div id="gen-rows"></div>
  </div>

</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-icon">
      <i class="ti ti-alert-triangle"></i>
    </div>
    <h3>Reset progress?</h3>
    <p class="modal-intro">You're about to permanently delete:</p>
    <ul class="modal-stats" id="modal-stats"></ul>
    <p class="modal-warning">
      <i class="ti ti-info-circle"></i>
      This action cannot be undone.
    </p>
    <div class="modal-actions">
      <button class="btn-modal cancel" id="modal-cancel">Cancel</button>
      <button class="btn-modal danger" id="modal-confirm">Reset everything</button>
    </div>
  </div>
</div>

<script>
const PROD_RATE = 0.1;
const SAVE_KEY = 'cascade-save-v5';
const D = (v) => new Decimal(v);
const D0 = D(0);
const D1 = D(1);
const THEME_KEY = 'cascade-theme';

function nameForTier(idx) {
  return 'Generator ' + (idx + 1);
}

function energyCostFor(idx) {
  return Decimal.pow(10, idx);
}
function prevGenCostFor(idx) {
  return idx === 0 ? D0 : D(5 * idx);
}

function tierInfo(idx) {
  return {
    name: nameForTier(idx),
    produces: idx === 0 ? 'Energy' : nameForTier(idx - 1),
    energyCost: energyCostFor(idx),
    prevGenCost: prevGenCostFor(idx),
  };
}

let isResetting = false;

let state = {
  energy: D1,
  gens: [D0],
  bought: [D0],
  startTime: Date.now(),
  lastSave: Date.now(),
};

const saved = localStorage.getItem(SAVE_KEY);
if (saved) {
  try {
    const parsed = JSON.parse(saved);
    if (Array.isArray(parsed.gens) && Array.isArray(parsed.bought)) {
      state.energy = parsed.energy != null ? D(parsed.energy) : D1;
      state.gens = parsed.gens.map(g => D(g));
      state.bought = parsed.bought.map(b => D(b));
      while (state.gens.length < state.bought.length) state.gens.push(D0);
      while (state.bought.length < state.gens.length) state.bought.push(D0);
      state.startTime = parsed.startTime || Date.now();
      state.lastSave = parsed.lastSave || Date.now();
      const offlineMs = Math.max(0, Date.now() - state.lastSave);
      if (offlineMs > 1000) simulate(offlineMs / 1000);
    }
  } catch(e) { console.error('save load failed', e); }
}

function ensureTier(idx) {
  while (state.gens.length <= idx) {
    state.gens.push(D0);
    state.bought.push(D0);
  }
}

const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No'];

function letterSuffix(idx) {
  // 0='aa', 1='ab'... 25='az', 26='ba'... 675='zz', 676='aaa'... 18251='zzz', 18252='aaaa'...
  let len = 2;
  let block = 26 * 26;
  let i = idx;
  while (i >= block) {
    i -= block;
    len++;
    block *= 26;
  }
  let result = '';
  for (let j = 0; j < len; j++) {
    result = String.fromCharCode(97 + (i % 26)) + result;
    i = Math.floor(i / 26);
  }
  return result;
}

function fmt(n) {
  if (n == null) return '0';
  if (typeof n === 'number') n = D(n);
  if (!n.isFinite()) return '∞';
  if (n.lt(0.01)) return '0';
  if (n.lt(1000)) {
    const v = n.toNumber();
    if (v < 10) return v.toFixed(2);
    if (v < 100) return v.toFixed(1);
    return Math.floor(v).toString();
  }
  const log = n.log10();
  const tierD = log.div(3).floor();
  const tier = tierD.toNumber();
  if (!isFinite(tier) || tier > 1e6) {
    // tetration territory — fallback to library's own format
    return n.toString();
  }
  const suffix = tier < SUFFIXES.length ? SUFFIXES[tier] : letterSuffix(tier - SUFFIXES.length);
  const mantissa = n.div(Decimal.pow(10, tier * 3)).toNumber();
  const numStr = mantissa.toFixed(2);
  return suffix ? numStr + ' ' + suffix : numStr;
}

function fmtInt(n) {
  if (typeof n === 'number') n = D(n);
  if (n.lt(1000)) return Math.floor(n.toNumber()).toString();
  return fmt(n);
}

function fmtTier(n) {
  return n.toLocaleString('pt-BR');
}

function costOf(idx) {
  ensureTier(idx);
  return energyCostFor(idx);
}
function prevGenNeeded(idx) {
  ensureTier(idx);
  return prevGenCostFor(idx);
}
let freeMode = localStorage.getItem('cascade-freemode') === '1';

function canAffordOne(idx) {
  const e = costOf(idx);
  const p = prevGenNeeded(idx);
  if (state.energy.lt(e)) return false;
  if (!freeMode && idx > 0 && (state.gens[idx - 1] || D0).lt(p)) return false;
  return true;
}

function maxAffordable(idx) {
  const e = costOf(idx);
  const p = prevGenNeeded(idx);
  const maxByEnergy = state.energy.div(e).floor();
  let maxByPrev = null;
  if (!freeMode && idx > 0 && p.gt(0)) {
    maxByPrev = (state.gens[idx - 1] || D0).div(p).floor();
  }
  let count = maxByEnergy;
  if (maxByPrev !== null && maxByPrev.lt(count)) count = maxByPrev;
  if (count.lt(0)) count = D0;
  return { count, energyCost: count.mul(e), prevCost: count.mul(p) };
}

function simulate(dt) {
  const factor = PROD_RATE * dt;
  const n = state.gens.length;
  for (let i = n - 1; i > 0; i--) {
    state.gens[i - 1] = state.gens[i - 1].add(state.gens[i].mul(factor));
  }
  state.energy = state.energy.add(state.gens[0].mul(factor));
}

function buy(idx, count) {
  ensureTier(idx);
  if (count === 'max') {
    const m = maxAffordable(idx);
    if (m.count.lte(0)) return;
    state.energy = state.energy.sub(m.energyCost);
    if (!freeMode && idx > 0) state.gens[idx - 1] = state.gens[idx - 1].sub(m.prevCost);
    state.gens[idx] = state.gens[idx].add(m.count);
    state.bought[idx] = state.bought[idx].add(m.count);
  } else {
    if (!canAffordOne(idx)) return;
    state.energy = state.energy.sub(costOf(idx));
    if (!freeMode && idx > 0) state.gens[idx - 1] = state.gens[idx - 1].sub(prevGenNeeded(idx));
    state.gens[idx] = state.gens[idx].add(1);
    state.bought[idx] = state.bought[idx].add(1);
  }
  pulseBadge(idx);
}

function pulseBadge(idx) {
  const r = rowCache[idx];
  if (!r) return;
  const badge = r.row.querySelector('.tier-badge');
  badge.classList.remove('pulse');
  void badge.offsetWidth;
  badge.classList.add('pulse');
}

function getVisibleTierIndices() {
  const visible = [];
  let firstUnbought = state.bought.length;
  for (let i = 0; i < state.bought.length; i++) {
    if (state.bought[i].gt(0)) {
      visible.push(i);
    } else if (firstUnbought === state.bought.length) {
      firstUnbought = i;
    }
  }
  visible.push(firstUnbought);
  return visible;
}

const rowCache = {};
const rowsContainer = document.getElementById('gen-rows');
const scrollEl = document.getElementById('gen-scroll');

function addRow(idx) {
  const t = tierInfo(idx);
  const row = document.createElement('div');
  row.className = 'gen-row';
  row.innerHTML = `
    <div><div class="tier-badge">${fmtTier(idx + 1)}</div></div>
    <div class="gen-num owned"></div>
    <div class="gen-num rate dim"></div>
    <div class="cost-group">
      <span class="cost-energy"></span>
      <span class="cost-prev"></span>
    </div>
    <div><button type="button" class="buy-btn b1">Buy 1</button></div>
    <div><button type="button" class="buy-btn bmax">Max</button></div>
  `;

  rowsContainer.appendChild(row);

  row.querySelector('.b1').addEventListener('click', () => buy(idx, 1));
  row.querySelector('.bmax').addEventListener('click', () => buy(idx, 'max'));

  rowCache[idx] = {
    row,
    owned: row.querySelector('.owned'),
    rate: row.querySelector('.rate'),
    costEnergy: row.querySelector('.cost-energy'),
    costPrev: row.querySelector('.cost-prev'),
    buy1: row.querySelector('.b1'),
    buyMax: row.querySelector('.bmax'),
  };
}

const ROW_GAP = 8;
const VIRTUAL_BUFFER = 5;
let measuredRowHeight = 66;
let lastVisibleCount = 0;

const maxTierEl = document.getElementById('max-tier-text');
let lastBadgeWidth = '38px';
function render() {
  document.getElementById('energy').textContent = fmt(state.energy);
  document.getElementById('rate').textContent = '+' + fmt((state.gens[0] || D0).mul(PROD_RATE));
  const maxTier = state.bought.filter(b => b.gt(0)).length;
  const maxTierText = maxTier > 0 ? fmtTier(maxTier) : '—';
  if (maxTierEl.textContent !== maxTierText) maxTierEl.textContent = maxTierText;

  // Responsive tier badge width based on highest visible tier number
  const highestVisibleTier = Math.max(state.bought.length, maxTier + 1);
  const tierStrLen = fmtTier(highestVisibleTier).length;
  const badgeW = Math.max(38, tierStrLen * 8 + 20);
  const badgeWStr = badgeW + 'px';
  if (lastBadgeWidth !== badgeWStr) {
    document.documentElement.style.setProperty('--tier-badge-min', badgeWStr);
    lastBadgeWidth = badgeWStr;
  }

  const visible = getVisibleTierIndices();

  // Detect newly unlocked tier (for animation + auto-scroll)
  let newlyUnlocked = null;
  let wasNearBottom = false;
  if (visible.length > lastVisibleCount && lastVisibleCount > 0) {
    newlyUnlocked = visible[visible.length - 1];
    wasNearBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 80;
  }
  lastVisibleCount = visible.length;

  // Measure row height (cached after first row in DOM)
  const anyRow = rowsContainer.querySelector('.gen-row');
  if (anyRow && anyRow.offsetHeight > 0) measuredRowHeight = anyRow.offsetHeight;
  const itemHeight = measuredRowHeight + ROW_GAP;

  // Set total scroll height
  rowsContainer.style.height = (visible.length * itemHeight - ROW_GAP) + 'px';

  // Determine viewport range
  const scrollTop = scrollEl.scrollTop;
  const clientHeight = scrollEl.clientHeight;
  const firstIdx = Math.max(0, Math.floor(scrollTop / itemHeight) - VIRTUAL_BUFFER);
  const lastIdx = Math.min(visible.length - 1, Math.ceil((scrollTop + clientHeight) / itemHeight) + VIRTUAL_BUFFER);

  // Set of tiers that should be in DOM right now
  const tiersInView = new Set();
  for (let i = firstIdx; i <= lastIdx; i++) tiersInView.add(visible[i]);

  // Remove rows that scrolled out of viewport
  for (const k of Object.keys(rowCache)) {
    const idx = +k;
    if (!tiersInView.has(idx)) {
      rowCache[idx].row.remove();
      delete rowCache[idx];
    }
  }

  // Add and position rows in viewport
  for (let i = firstIdx; i <= lastIdx; i++) {
    const idx = visible[i];
    if (!rowCache[idx]) addRow(idx);
    rowCache[idx].row.style.top = (i * itemHeight) + 'px';
  }

  // Trigger appearance animation for newly unlocked tier
  if (newlyUnlocked !== null && rowCache[newlyUnlocked]) {
    const row = rowCache[newlyUnlocked].row;
    row.classList.remove('new-tier');
    void row.offsetWidth;
    row.classList.add('new-tier');
    setTimeout(() => row.classList.remove('new-tier'), 500);
  }

  // Auto-scroll to bottom if user was already there
  if (wasNearBottom) {
    requestAnimationFrame(() => {
      scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: 'smooth' });
    });
  }

  for (const idx of tiersInView) {
    const r = rowCache[idx];
    const cost = costOf(idx);
    const prevCost = prevGenNeeded(idx);
    const hasEnergy = state.energy.gte(cost);
    const hasPrev = freeMode || idx === 0 || (state.gens[idx - 1] || D0).gte(prevCost);
    const canAfford = hasEnergy && hasPrev;
    const max = maxAffordable(idx);
    const owned = state.gens[idx] || D0;
    const isBought = (state.bought[idx] || D0).gt(0);
    const tierRate = owned.mul(PROD_RATE);

    r.row.classList.toggle('has-owned', isBought);
    r.row.classList.toggle('is-next', !isBought);

    r.owned.textContent = fmt(owned);
    r.owned.classList.toggle('muted', owned.lt(0.01));
    r.rate.textContent = owned.gt(0.01) ? '+' + fmt(tierRate) + '/s' : '—';
    r.rate.classList.toggle('muted', owned.lte(0.01));

    r.costEnergy.textContent = fmt(cost);
    r.costEnergy.classList.toggle('lacking', !hasEnergy);
    const showPrev = idx > 0 && prevCost.gt(0);
    r.costPrev.textContent = showPrev ? fmt(prevCost) + ' G' + idx : '';
    r.costPrev.style.display = showPrev ? '' : 'none';
    r.costPrev.classList.toggle('lacking', showPrev && !hasPrev);

    if (r.buy1.disabled !== !canAfford) r.buy1.disabled = !canAfford;
    r.buy1.classList.toggle('afford', canAfford);
    const maxDisabled = max.count.lte(0);
    if (r.buyMax.disabled !== maxDisabled) r.buyMax.disabled = maxDisabled;
    const maxText = max.count.gt(0) ? '+' + fmtInt(max.count) : 'Max';
    if (r.buyMax.textContent !== maxText) r.buyMax.textContent = maxText;
  }

  document.getElementById('elapsed-text').textContent = formatElapsed(Math.floor((Date.now() - state.startTime) / 1000));
}

function formatElapsed(elapsed) {
  const MINUTE = 60, HOUR = 3600, DAY = 86400, MONTH = 30 * DAY, YEAR = 365 * DAY;
  if (elapsed >= YEAR) {
    const y = Math.floor(elapsed / YEAR);
    const mo = Math.floor((elapsed % YEAR) / MONTH);
    return y + 'y ' + mo + 'mo';
  }
  if (elapsed >= MONTH) {
    const mo = Math.floor(elapsed / MONTH);
    const d = Math.floor((elapsed % MONTH) / DAY);
    return mo + 'mo ' + d + 'd';
  }
  if (elapsed >= DAY) {
    const d = Math.floor(elapsed / DAY);
    const h = Math.floor((elapsed % DAY) / HOUR);
    return d + 'd ' + h + 'h';
  }
  if (elapsed >= HOUR) {
    const h = Math.floor(elapsed / HOUR);
    const m = Math.floor((elapsed % HOUR) / MINUTE);
    return h + 'h ' + m + 'm';
  }
  if (elapsed >= MINUTE) {
    const m = Math.floor(elapsed / MINUTE);
    const s = elapsed % 60;
    return m + 'm ' + s + 's';
  }
  return elapsed + 's';
}

let lastTick = performance.now();
let fpsLast = lastTick;
let fpsFrames = 0;
const fpsEl = document.getElementById('fps-text');
function loop(now) {
  const dt = Math.min((now - lastTick) / 1000, 0.1);
  lastTick = now;
  simulate(dt);
  if (autoBuy) tryAutoBuy();
  render();
  fpsFrames++;
  if (now - fpsLast >= 500) {
    const fps = Math.round((fpsFrames * 1000) / (now - fpsLast));
    fpsEl.textContent = fps + ' fps';
    fpsFrames = 0;
    fpsLast = now;
  }
  requestAnimationFrame(loop);
}

const modal = document.getElementById('modal');
const modalCancel = document.getElementById('modal-cancel');
const modalConfirm = document.getElementById('modal-confirm');
const modalStats = document.getElementById('modal-stats');
let lastFocused = null;

function showResetModal() {
  const totalGens = state.gens.reduce((a, b) => a.add(b), D0);
  const tierCount = state.bought.filter(b => b.gt(0)).length;
  const timeStr = formatElapsed(Math.floor((Date.now() - state.startTime) / 1000));

  modalStats.innerHTML = `
    <li><span class="v">${fmt(state.energy)}</span> <span class="lbl">Energy</span></li>
    <li><span class="v">${fmt(totalGens)}</span> <span class="lbl">generators across ${tierCount} ${tierCount === 1 ? 'tier' : 'tiers'}</span></li>
    <li><span class="v">${timeStr}</span> <span class="lbl">of play time</span></li>
  `;

  lastFocused = document.activeElement;
  modal.removeAttribute('hidden');
  setTimeout(() => modalCancel.focus(), 50);
}

function hideModal() {
  modal.setAttribute('hidden', '');
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

document.getElementById('reset').addEventListener('click', showResetModal);
modalCancel.addEventListener('click', hideModal);
modal.addEventListener('click', (e) => {
  if (e.target === modal) hideModal();
});
modalConfirm.addEventListener('click', () => {
  isResetting = true;
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
  location.reload();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modal.hasAttribute('hidden')) hideModal();
});

function save() {
  if (isResetting) return;
  state.lastSave = Date.now();
  try {
    const serialized = {
      energy: state.energy.toString(),
      gens: state.gens.map(g => g.toString()),
      bought: state.bought.map(b => b.toString()),
      startTime: state.startTime,
      lastSave: state.lastSave,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(serialized));
    const t = new Date();
    const hh = String(t.getHours()).padStart(2,'0');
    const mm = String(t.getMinutes()).padStart(2,'0');
    const ss = String(t.getSeconds()).padStart(2,'0');
    document.getElementById('save-text').textContent = `saved ${hh}:${mm}:${ss}`;
  } catch(e) { console.error('save failed', e); }
}
const saveInterval = setInterval(save, 5000);
window.addEventListener('beforeunload', () => { if (!isResetting) save(); });

let lastVisibleAt = Date.now();
let wakeLock = null;
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { /* permission denied or unsupported */ }
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (!isResetting) save();
    lastVisibleAt = Date.now();
  } else if (document.visibilityState === 'visible') {
    const elapsedMs = Math.max(0, Date.now() - lastVisibleAt);
    if (elapsedMs > 500) simulate(elapsedMs / 1000);
    lastVisibleAt = Date.now();
    lastTick = performance.now();
    if (wakeLock === null) requestWakeLock();
  }
});
requestWakeLock();

const html = document.documentElement;
const themeBtn = document.getElementById('theme-toggle');
const themeIcon = document.getElementById('theme-icon');
function setTheme(mode) {
  html.classList.toggle('dark', mode === 'dark');
  themeIcon.className = 'ti ' + (mode === 'dark' ? 'ti-moon' : 'ti-sun');
  localStorage.setItem(THEME_KEY, mode);
}
themeBtn.addEventListener('click', () => {
  setTheme(html.classList.contains('dark') ? 'light' : 'dark');
});
const savedTheme = localStorage.getItem(THEME_KEY);
const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
setTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

const freemodeBtn = document.getElementById('freemode-toggle');
function applyFreeMode() {
  freemodeBtn.classList.toggle('active', freeMode);
  html.classList.toggle('freemode', freeMode);
}
freemodeBtn.addEventListener('click', () => {
  freeMode = !freeMode;
  localStorage.setItem('cascade-freemode', freeMode ? '1' : '0');
  applyFreeMode();
});
applyFreeMode();

let autoBuy = localStorage.getItem('cascade-autobuy') === '1';
const autobuyBtn = document.getElementById('autobuy-toggle');
function applyAutoBuy() { autobuyBtn.classList.toggle('active', autoBuy); }
autobuyBtn.addEventListener('click', () => {
  autoBuy = !autoBuy;
  localStorage.setItem('cascade-autobuy', autoBuy ? '1' : '0');
  applyAutoBuy();
});
applyAutoBuy();

document.getElementById('scroll-top').addEventListener('click', () => {
  scrollEl.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('scroll-bottom').addEventListener('click', () => {
  scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: 'smooth' });
});

function tryAutoBuy() {
  for (let i = 0; i < state.bought.length; i++) {
    if (state.bought[i].lte(0)) {
      if (canAffordOne(i)) buy(i, 1);
      return;
    }
  }
  const next = state.bought.length;
  ensureTier(next);
  if (canAffordOne(next)) buy(next, 1);
}

render();
requestAnimationFrame(loop);
</script>

</body>
</html>
